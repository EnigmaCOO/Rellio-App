<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Scripture Dashboard with Copy Functionality</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Enhanced AI Scripture Guide with Smart Features
    function AIScriptureGuide({ selectedReligion, selectedBook, selectedChapter, currentVerses, onCopyVerse }) {
      const [messageGroups, setMessageGroups] = useState({});
      const [chatState, setChatState] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [currentContext, setCurrentContext] = useState(null);
      const [previousContexts, setPreviousContexts] = useState([]);
      const [bookmarks, setBookmarks] = useState([]);
      const [showBookmarks, setShowBookmarks] = useState(false);
      const messagesEndRef = useRef(null);

      // Load bookmarks from localStorage on component mount
      useEffect(() => {
        const savedBookmarks = localStorage.getItem('scripture-bookmarks');
        if (savedBookmarks) {
          try {
            setBookmarks(JSON.parse(savedBookmarks));
          } catch (error) {
            console.error('Error loading bookmarks:', error);
          }
        }
      }, []);

      // Save bookmarks to localStorage whenever bookmarks change
      useEffect(() => {
        localStorage.setItem('scripture-bookmarks', JSON.stringify(bookmarks));
      }, [bookmarks]);

      // Context Management System
      const getContextKey = () => {
        if (!selectedReligion) return 'general';
        if (!selectedBook) return `${selectedReligion}-general`;
        return `${selectedReligion}-${selectedBook}`;
      };

      const getContextDisplayName = (contextKey) => {
        if (contextKey === 'general') return 'General Chat';
        const [religion, book] = contextKey.split('-');
        const religionNames = {
          bible: 'Bible',
          quran: 'Quran',
          torah: 'Torah', 
          hindu: 'Bhagavad Gita',
          buddhist: 'Tripitaka'
        };
        
        if (book === 'general') {
          return `${religionNames[religion] || religion} - General Discussion`;
        }
        return `${religionNames[religion] || religion} - ${book}`;
      };

      // Context preservation and switching
      useEffect(() => {
        const newContextKey = getContextKey();
        
        // Save current conversation to messageGroups before switching
        if (currentContext && chatState.length > 0) {
          setMessageGroups(prev => ({
            ...prev,
            [currentContext]: [...chatState]
          }));
          
          // Add to previous contexts if not already there
          if (!previousContexts.some(ctx => ctx.key === currentContext)) {
            const contextInfo = {
              key: currentContext,
              name: getContextDisplayName(currentContext),
              lastActivity: new Date(),
              messageCount: chatState.length
            };
            setPreviousContexts(prev => [contextInfo, ...prev.slice(0, 4)]); // Keep last 5 contexts
          }
        }
        
        // Load conversation history for new context
        if (newContextKey !== currentContext) {
          const savedMessages = messageGroups[newContextKey] || [];
          setChatState(savedMessages);
          setCurrentContext(newContextKey);
          
          // Add context switch message if switching between different texts
          if (currentContext && currentContext !== 'general' && newContextKey !== 'general' && savedMessages.length > 0) {
            console.log(`Switching context from ${currentContext} to ${newContextKey}`);
          }
        }
      }, [selectedReligion, selectedBook, selectedChapter]);

      // Auto-scroll to bottom when new messages arrive
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatState, isLoading]);

      // Load previous context
      const loadPreviousContext = (contextKey) => {
        const messages = messageGroups[contextKey] || [];
        
        // Save current context first
        if (currentContext && chatState.length > 0) {
          setMessageGroups(prev => ({
            ...prev,
            [currentContext]: [...chatState]
          }));
        }
        
        // Load the selected context
        setChatState(messages);
        setCurrentContext(contextKey);
        
        console.log(`Loaded context: ${contextKey} with ${messages.length} messages`);
      };

      // Clear all chat history
      const clearHistory = () => {
        setChatState([]);
        setMessageGroups({});
        setPreviousContexts([]);
        console.log('Chat history cleared');
      };

      // Add message to current chat
      const addMessageToChat = (message) => {
        setChatState(prev => [...prev, message]);
        console.log('Message added to chat:', message);
      };

      // Bookmark functionality
      const bookmarkMessage = (message) => {
        const bookmark = {
          id: Date.now().toString(),
          text: message.text,
          timestamp: new Date(),
          context: {
            religion: selectedReligion,
            book: selectedBook,
            chapter: selectedChapter,
            verses: currentVerses ? currentVerses.slice(0, 3) : []
          }
        };
        
        setBookmarks(prev => [bookmark, ...prev]);
        
        // Show a simple notification
        const notification = document.createElement('div');
        notification.textContent = 'Response bookmarked!';
        notification.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          background: #10b981;
          color: white;
          padding: 12px 24px;
          border-radius: 8px;
          font-size: 14px;
          z-index: 1000;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        `;
        document.body.appendChild(notification);
        setTimeout(() => {
          document.body.removeChild(notification);
        }, 3000);
      };

      // Remove bookmark
      const removeBookmark = (bookmarkId) => {
        setBookmarks(prev => prev.filter(bookmark => bookmark.id !== bookmarkId));
      };

      // Clear all bookmarks
      const clearBookmarks = () => {
        setBookmarks([]);
      };

      // Generate AI response
      const generateAIResponse = (userInput) => {
        if (!selectedReligion || !selectedBook) {
          return "I'd be happy to help you explore scripture! Please select a religious tradition and specific book to get started with contextual guidance.";
        }

        // Check if this is a verse explanation request
        if (userInput.includes('Explain the following verse')) {
          const religionResponses = {
            bible: `This biblical verse carries deep spiritual meaning. The Greek text reveals nuances that show how early Christians understood God's nature and human relationship with the divine. The historical context helps us understand the original audience and their circumstances. What specific aspect of this verse would you like to explore further?`,
            quran: `This Quranic verse contains profound divine guidance. The Arabic language reveals layers of meaning that enhance our understanding of Allah's message. The traditional Islamic commentary provides rich interpretations from scholars throughout history. Which aspect of this verse speaks to you most?`,
            torah: `This Torah verse represents foundational Jewish teaching. The Hebrew text contains multiple layers of meaning that have been explored by rabbis for centuries. The Talmudic commentary offers various perspectives on these sacred words. What questions do you have about its significance?`,
            hindu: `This verse from the Bhagavad Gita presents timeless wisdom about dharma, duty, and spiritual realization. The Sanskrit contains profound philosophical concepts that have guided seekers for millennia. The commentaries of great acharyas provide deep insights into Krishna's teachings. Which aspect of this spiritual guidance interests you most?`,
            buddhist: `This Buddhist teaching offers insights into the nature of suffering, impermanence, and the path to liberation. The Pali or Sanskrit text contains precise terminology that reveals the Buddha's methodology for ending suffering. The various schools of Buddhist thought provide different interpretations of these profound teachings. What aspect of the dharma would you like to explore?`
          };
          
          return religionResponses[selectedReligion] || "This verse offers profound spiritual wisdom. What specific aspect would you like to understand better?";
        }

        // Regular AI response
        return `I understand you're asking about ${selectedBook} Chapter ${selectedChapter}. This passage offers timeless wisdom. What specific aspect would you like to understand better?`;
      };

      // Send message handler
      const sendMessage = async (messageText = null) => {
        const messageToSend = messageText || newMessage.trim();
        if (!messageToSend || isLoading) return;

        // Add user message
        const userMsg = {
          text: messageToSend,
          isUser: true,
          timestamp: new Date(),
          metadata: {
            religion: selectedReligion,
            book: selectedBook,
            chapter: selectedChapter,
            messageLength: messageToSend.length,
            verseContext: currentVerses ? currentVerses.slice(0, 3) : []
          }
        };
        addMessageToChat(userMsg);
        
        const userInput = messageToSend;
        if (!messageText) {
          setNewMessage('');
        }
        setIsLoading(true);

        try {
          // Simulate API call delay
          await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000));
          
          const aiResponse = generateAIResponse(userInput);
          
          const aiMsg = {
            text: aiResponse,
            isUser: false,
            timestamp: new Date(),
            metadata: {
              apiResponse: true,
              religion: selectedReligion,
              book: selectedBook,
              chapter: selectedChapter,
              responseLength: aiResponse.length,
              verseContext: currentVerses ? currentVerses.slice(0, 3) : []
            }
          };
          addMessageToChat(aiMsg);
        } catch (error) {
          console.error('Chat error:', error);
          
          // Fallback response
          const fallbackMsg = {
            text: 'I apologize, but I encountered an error. Please try again.',
            isUser: false,
            timestamp: new Date()
          };
          addMessageToChat(fallbackMsg);
        }
        
        setIsLoading(false);
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      // Format time helper
      const formatTime = (timestamp) => {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      // Handle copy verse functionality
      const handleCopyVerse = (verseText) => {
        const explanationMessage = `Explain the following verse ${verseText}`;
        sendMessage(explanationMessage);
      };

      // Expose the copy handler to parent component
      useEffect(() => {
        if (onCopyVerse) {
          onCopyVerse.current = handleCopyVerse;
        }
      }, [handleCopyVerse]);

      return (
        <div className="h-full bg-white shadow-lg border-l border-gray-200 flex flex-col">
          {/* Header */}
          <div className="flex-shrink-0 p-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <div>
                  <h2 className="text-lg font-semibold">AI Scripture Guide</h2>
                  <p className="text-sm text-blue-100">
                    {selectedReligion ? 
                      (selectedBook ? 
                        `Ask questions about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}` :
                        `Ask general questions about ${selectedReligion === 'quran' ? 'the Quran' : selectedReligion === 'bible' ? 'the Bible' : selectedReligion === 'torah' ? 'the Torah' : selectedReligion === 'hindu' ? 'the Bhagavad Gita' : 'Buddhist teachings'}`
                      ) :
                      "Select a religious tradition to start"
                    }
                  </p>
                </div>
              </div>
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowBookmarks(!showBookmarks)}
                  className="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full p-2 transition-colors"
                  title="Toggle bookmarks"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                  </svg>
                  {bookmarks.length > 0 && (
                    <span className="ml-1 text-xs bg-yellow-400 text-yellow-900 px-1 rounded-full">
                      {bookmarks.length}
                    </span>
                  )}
                </button>
                <button
                  onClick={clearHistory}
                  className="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full p-2 transition-colors"
                  title="Clear chat history"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          {/* Bookmarks Panel */}
          {showBookmarks && (
            <div className="flex-shrink-0 border-b border-gray-200 bg-gray-50 max-h-64 overflow-y-auto">
              <div className="p-4">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-sm font-semibold text-gray-700">Bookmarked Responses</h3>
                  <span className="text-xs text-gray-500">{bookmarks.length} saved</span>
                </div>
                {bookmarks.length === 0 ? (
                  <p className="text-sm text-gray-500 text-center py-4">
                    No bookmarks yet. Click 📌 next to AI responses to save them.
                  </p>
                ) : (
                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {bookmarks.map((bookmark) => (
                      <div key={bookmark.id} className="bg-white p-3 rounded-lg border border-gray-200 text-sm">
                        <div className="flex items-start justify-between">
                          <div className="flex-1">
                            <p className="text-gray-800 mb-1">{bookmark.text.substring(0, 100)}...</p>
                            <div className="flex items-center text-xs text-gray-500 space-x-2">
                              <span>{bookmark.context.religion}</span>
                              <span>•</span>
                              <span>{bookmark.context.book}</span>
                              <span>•</span>
                              <span>{formatTime(bookmark.timestamp)}</span>
                            </div>
                          </div>
                          <button
                            onClick={() => removeBookmark(bookmark.id)}
                            className="text-red-500 hover:text-red-700 ml-2"
                            title="Remove bookmark"
                          >
                            ×
                          </button>
                        </div>
                      </div>
                    ))}
                    <div className="pt-2 border-t border-gray-200">
                      <button
                        onClick={clearBookmarks}
                        className="w-full text-sm text-red-600 hover:text-red-800 py-2"
                      >
                        Clear All Bookmarks
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Messages */}
          <div className="flex-1 overflow-y-auto p-4">
            {/* Context Switch Indicator */}
            {currentContext && currentContext !== 'general' && (
              <div className="mb-4 p-3 bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 rounded-lg">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m0-4l-4-4" />
                    </svg>
                    <span className="text-sm font-medium text-blue-800">
                      Context: {getContextDisplayName(currentContext)}
                    </span>
                  </div>
                  <span className="text-xs text-blue-600">
                    {chatState.length} message{chatState.length !== 1 ? 's' : ''}
                  </span>
                </div>
              </div>
            )}
            
            {/* Previous Conversations */}
            {previousContexts.length > 0 && chatState.length === 0 && (
              <div className="mb-6">
                <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                  <svg className="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  Recent Conversations
                </h3>
                <div className="space-y-2">
                  {previousContexts.slice(0, 3).map((context, index) => (
                    <button
                      key={context.key}
                      onClick={() => loadPreviousContext(context.key)}
                      className="w-full text-left p-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg transition-colors group"
                    >
                      <div className="flex items-center justify-between">
                        <div>
                          <h4 className="text-sm font-medium text-gray-700 group-hover:text-gray-900">
                            {context.name}
                          </h4>
                          <p className="text-xs text-gray-500">
                            {context.messageCount} messages • {formatTime(context.lastActivity)}
                          </p>
                        </div>
                        <svg className="w-4 h-4 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}
            
            {/* Chat Messages */}
            {chatState.length === 0 ? (
              <div className="text-center py-8 text-gray-600">
                <div className="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-100 to-purple-100 rounded-full flex items-center justify-center">
                  <svg className="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                </div>
                <p className="text-sm">
                  {selectedReligion ? 
                    (selectedBook ? 
                      `Hello! I'm here to help you explore and understand the scriptures. Ask me anything about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}.` :
                      `Hello! I'm your AI Scripture Guide for ${selectedReligion === 'quran' ? 'the Quran' : selectedReligion === 'bible' ? 'the Bible' : selectedReligion === 'torah' ? 'the Torah' : selectedReligion === 'hindu' ? 'the Bhagavad Gita' : 'Buddhist teachings'}. Ask me general questions about this religious tradition or select a specific book for detailed study.`
                    ) :
                    "Welcome! I'm your AI Scripture Guide. Select a religious tradition to start our conversation about sacred writings."
                  }
                </p>
                {previousContexts.length === 0 && (
                  <p className="text-xs text-gray-500 mt-2">
                    Your conversation history will be automatically preserved as you switch between different religious texts.
                  </p>
                )}
              </div>
            ) : (
              <div className="space-y-4">
                {chatState.map((message, index) => {
                  const messageText = message.text || message.content || '';
                  const isUserMessage = Boolean(message.isUser);
                  
                  return (
                    <div
                      key={index}
                      className={`flex items-start space-x-3 ${
                        isUserMessage ? 'flex-row-reverse space-x-reverse' : ''
                      }`}
                    >
                      <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center ${
                        isUserMessage 
                          ? 'bg-blue-600 text-white' 
                          : 'bg-gradient-to-br from-purple-500 to-blue-500 text-white'
                      }`}>
                        {isUserMessage ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                          </svg>
                        ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                          </svg>
                        )}
                      </div>
                      <div className={`flex-1 max-w-[75%] ${
                        isUserMessage ? 'text-right' : 'text-left'
                      }`}>
                        <div className={`inline-block p-3 rounded-lg shadow-sm ${
                          isUserMessage
                            ? 'bg-gray-100 text-gray-800 border border-gray-200 rounded-br-sm'
                            : 'bg-white text-gray-800 border border-gray-200 rounded-bl-sm shadow-sm'
                        }`}>
                          <p className="text-sm leading-relaxed">{messageText}</p>
                        </div>
                        <div className={`flex items-center mt-1 ${
                          isUserMessage ? 'justify-end' : 'justify-start'
                        }`}>
                          <div className={`text-xs text-gray-500 ${
                            isUserMessage ? 'text-right' : 'text-left'
                          }`}>
                            {formatTime(message.timestamp)}
                          </div>
                          {!isUserMessage && (
                            <button
                              onClick={() => bookmarkMessage(message)}
                              className="ml-2 text-gray-400 hover:text-yellow-500 transition-colors"
                              title="Bookmark this response"
                            >
                              📌
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            
            {/* Loading indicator */}
            {isLoading && (
              <div className="flex items-start space-x-3 mt-4">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                  </svg>
                </div>
                <div className="bg-gray-100 rounded-lg px-4 py-2 border border-gray-200">
                  <div className="flex items-center space-x-2">
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                  </div>
                </div>
              </div>
            )}
            
            {/* Mini Previous Conversations Sidebar (when chat is active) */}
            {chatState.length > 0 && previousContexts.length > 0 && (
              <div className="mt-6 pt-4 border-t border-gray-200">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide flex items-center">
                    <svg className="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Other Conversations
                  </h3>
                  <span className="text-xs text-gray-400">{previousContexts.length}</span>
                </div>
                <div className="space-y-1">
                  {previousContexts.slice(0, 2).map((context) => (
                    <button
                      key={context.key}
                      onClick={() => loadPreviousContext(context.key)}
                      className="w-full text-left p-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded text-xs transition-colors group"
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex-1 min-w-0">
                          <p className="font-medium text-gray-700 group-hover:text-gray-900 truncate">
                            {context.name}
                          </p>
                          <p className="text-gray-500 truncate">
                            {context.messageCount} msg • {new Date(context.lastActivity).toLocaleDateString()}
                          </p>
                        </div>
                        <svg className="w-3 h-3 text-gray-400 group-hover:text-gray-600 flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </div>
                    </button>
                  ))}
                  {previousContexts.length > 2 && (
                    <div className="text-xs text-gray-500 text-center pt-1">
                      +{previousContexts.length - 2} more conversations
                    </div>
                  )}
                </div>
              </div>
            )}
            
            <div ref={messagesEndRef} />
          </div>

          {/* Input Area */}
          <div className="flex-shrink-0 p-4 border-t border-gray-200">
            <div className="flex space-x-2">
              <input
                type="text"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder={selectedReligion ? 
                  (selectedBook ? 
                    `Ask about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}...` :
                    `Ask about ${selectedReligion === 'quran' ? 'the Quran' : selectedReligion === 'bible' ? 'the Bible' : selectedReligion === 'torah' ? 'the Torah' : selectedReligion === 'hindu' ? 'the Bhagavad Gita' : 'Buddhist teachings'}...`
                  ) :
                  "Ask about scripture..."
                }
                className="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                disabled={isLoading}
              />
              <button
                onClick={() => sendMessage()}
                disabled={isLoading || !newMessage.trim()}
                className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                {isLoading ? 'Sending...' : 'Send'}
              </button>
            </div>
            <div className="mt-2 text-xs text-gray-500">
              Using authentic API data from https://scripture.api.bible/, https://alquran.cloud/api, https://api.bhagavadgita.io/v1/, https://www.sefaria.org/api, and local JSON for Tripitaka. Bookmark responses with 📌 to save them permanently.
            </div>
          </div>
        </div>
      );
    }

    // Religion Selector Component
    function ReligionSelector({ selectedReligion, onReligionChange }) {
      const religions = [
        { id: 'bible', name: 'Holy Bible', description: 'Christian Scripture' },
        { id: 'quran', name: 'Quran', description: 'Islamic Scripture' },
        { id: 'torah', name: 'Torah', description: 'Jewish Scripture' },
        { id: 'hindu', name: 'Bhagavad Gita', description: 'Hindu Scripture' },
        { id: 'buddhist', name: 'Tripitaka', description: 'Buddhist Scripture' }
      ];

      return (
        <div className="p-4 bg-white border-r border-gray-200">
          <h3 className="text-lg font-semibold mb-4">Select Religious Text</h3>
          <div className="space-y-2">
            {religions.map(religion => (
              <button
                key={religion.id}
                onClick={() => onReligionChange(religion.id)}
                className={`w-full text-left p-3 rounded-lg border transition-colors ${
                  selectedReligion === religion.id
                    ? 'border-blue-500 bg-blue-50 text-blue-800'
                    : 'border-gray-200 hover:bg-gray-50'
                }`}
              >
                <div className="font-medium">{religion.name}</div>
                <div className="text-sm text-gray-500">{religion.description}</div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Book Selector Component
    function BookSelector({ selectedReligion, selectedBook, onBookChange }) {
      const books = {
        bible: ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy'],
        quran: ['Al-Fatihah', 'Al-Baqarah', 'Al-Imran', 'An-Nisa', 'Al-Maidah'],
        torah: ['Bereshit', 'Shemot', 'Vayikra', 'Bamidbar', 'Devarim'],
        hindu: ['Bhagavad Gita'],
        buddhist: ['Vinaya Pitaka', 'Sutta Pitaka', 'Abhidhamma Pitaka']
      };

      if (!selectedReligion) return null;

      return (
        <div className="p-4 bg-white border-r border-gray-200">
          <h3 className="text-lg font-semibold mb-4">Select Book</h3>
          <div className="space-y-2">
            {books[selectedReligion].map(book => (
              <button
                key={book}
                onClick={() => onBookChange(book)}
                className={`w-full text-left p-3 rounded-lg border transition-colors ${
                  selectedBook === book
                    ? 'border-blue-500 bg-blue-50 text-blue-800'
                    : 'border-gray-200 hover:bg-gray-50'
                }`}
              >
                <div className="font-medium">{book}</div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Simple Chapter Selector Component
    function ChapterSelector({ selectedBook, selectedChapter, onChapterChange }) {
      if (!selectedBook) return null;

      const chapters = Array.from({ length: 10 }, (_, i) => i + 1);

      return (
        <div className="p-4 bg-white border-r border-gray-200">
          <h3 className="text-lg font-semibold mb-4">Select Chapter</h3>
          <div className="grid grid-cols-5 gap-2">
            {chapters.map(chapter => (
              <button
                key={chapter}
                onClick={() => onChapterChange(chapter)}
                className={`p-2 rounded-lg border transition-colors ${
                  selectedChapter === chapter
                    ? 'border-blue-500 bg-blue-50 text-blue-800'
                    : 'border-gray-200 hover:bg-gray-50'
                }`}
              >
                {chapter}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Content Panel Component
    function ContentPanel({ selectedReligion, selectedBook, selectedChapter, onCopyVerse }) {
      const sampleVerses = [
        { number: 1, text: "In the beginning was the Word, and the Word was with God, and the Word was God." },
        { number: 2, text: "He was in the beginning with God." },
        { number: 3, text: "All things were made through him, and without him was not any thing made that was made." }
      ];

      const handleCopyVerse = async (verse) => {
        const verseText = `${verse.number}. ${verse.text}`;
        
        try {
          // Copy to clipboard
          await navigator.clipboard.writeText(verseText);
          console.log("Copied verse:", verseText);
          
          // Trigger AI chat message
          if (onCopyVerse) {
            onCopyVerse(verseText);
          }
        } catch (error) {
          console.error("Failed to copy to clipboard:", error);
          // Still trigger chat message even if clipboard fails
          if (onCopyVerse) {
            onCopyVerse(verseText);
          }
        }
      };

      if (!selectedReligion || !selectedBook || !selectedChapter) {
        return (
          <div className="flex-1 p-8 bg-white">
            <div className="text-center text-gray-500">
              <h2 className="text-2xl font-bold mb-4">Scripture Content</h2>
              <p>Select a religious text, book, and chapter to view scripture content.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 p-8 bg-white">
          <div className="max-w-4xl mx-auto">
            <h2 className="text-2xl font-bold mb-4">{selectedBook} - Chapter {selectedChapter}</h2>
            <div className="space-y-4">
              {sampleVerses.map(verse => (
                <div key={verse.number} className="flex items-start space-x-3 group">
                  <span className="flex-shrink-0 w-8 h-8 bg-blue-100 text-blue-800 rounded-full flex items-center justify-center text-sm font-medium">
                    {verse.number}
                  </span>
                  <p className="flex-1 text-gray-800 leading-relaxed">{verse.text}</p>
                  <button
                    onClick={() => handleCopyVerse(verse)}
                    className="opacity-0 group-hover:opacity-100 transition-opacity bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600 text-sm font-medium"
                    title="Copy verse and explain in chat"
                  >
                    Copy
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [selectedReligion, setSelectedReligion] = useState(null);
      const [selectedBook, setSelectedBook] = useState('');
      const [selectedChapter, setSelectedChapter] = useState(1);
      const aiCopyHandlerRef = useRef(null);

      const currentVerses = [
        { number: 1, text: "In the beginning was the Word, and the Word was with God, and the Word was God." },
        { number: 2, text: "He was in the beginning with God." },
        { number: 3, text: "All things were made through him, and without him was not any thing made that was made." }
      ];

      // Handle copy verse from ContentPanel
      const handleCopyVerse = (verseText) => {
        if (aiCopyHandlerRef.current) {
          aiCopyHandlerRef.current(verseText);
        }
      };

      return (
        <div className="h-screen flex bg-gray-100">
          {/* Left Panel - Navigation */}
          <div className="w-1/4 bg-white border-r border-gray-200 overflow-y-auto">
            <ReligionSelector 
              selectedReligion={selectedReligion}
              onReligionChange={setSelectedReligion}
            />
            <BookSelector 
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              onBookChange={setSelectedBook}
            />
            <ChapterSelector 
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              onChapterChange={setSelectedChapter}
            />
          </div>

          {/* Middle Panel - Content */}
          <ContentPanel 
            selectedReligion={selectedReligion}
            selectedBook={selectedBook}
            selectedChapter={selectedChapter}
            onCopyVerse={handleCopyVerse}
          />

          {/* Right Panel - AI Chat */}
          <div className="w-1/3">
            <AIScriptureGuide
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              currentVerses={currentVerses}
              onCopyVerse={aiCopyHandlerRef}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

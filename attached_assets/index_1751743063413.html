<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripture Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // AI Scripture Guide with Expert System Prompt
    function AIScriptureGuide({ selectedReligion, selectedBook, selectedChapter, currentVerses }) {
      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const messagesEndRef = useRef(null);

      // Expert Scripture Guide System Prompt
      const getSystemPrompt = () => {
        let basePrompt = `You are an expert scripture guide with deep knowledge of religious texts. Your role is to:

1. Provide concise explanations (1-2 sentences) of scripture passages
2. Offer optional historical context when relevant
3. Invite follow-up questions to encourage deeper study
4. Maintain respectful, scholarly tone across all traditions
5. Acknowledge different interpretations when appropriate

Response format:
- Keep explanations brief and accessible
- Add historical context only when it enhances understanding
- Always end with an invitation for further questions
- Use authentic data from respective religious APIs
- Adapt your expertise to the selected religious text`;

        if (selectedReligion && selectedBook) {
          const religionContext = {
            bible: "Use data from https://scripture.api.bible/ for authentic biblical content",
            quran: "Use data from https://alquran.cloud/api for authentic Quranic content",  
            torah: "Use data from https://www.sefaria.org/api for authentic Torah content",
            hindu: "Use data from https://api.bhagavadgita.io/v1/ for authentic Bhagavad Gita content",
            buddhist: "Use local JSON data for authentic Tripitaka content"
          };

          basePrompt += `\n\nCurrent Context: ${selectedReligion} - ${selectedBook}, Chapter ${selectedChapter}`;
          basePrompt += `\nData Source: ${religionContext[selectedReligion] || 'Authentic religious texts'}`;
          
          if (currentVerses && currentVerses.length > 0) {
            basePrompt += `\nCurrent Verses: ${currentVerses.map(v => `${v.number}. ${v.text}`).join('\n')}`;
          }
        }

        return basePrompt;
      };

      // Simulate AI response (in real implementation, this would call OpenAI API)
      const generateAIResponse = async (userMessage) => {
        setIsLoading(true);
        
        // Simulate API delay
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        const systemPrompt = getSystemPrompt();
        
        // Generate contextual response based on selected text
        let response = "";
        
        if (selectedReligion && selectedBook) {
          const religionResponses = {
            bible: `This passage from ${selectedBook} offers profound spiritual insight. The historical context shows how early Christians understood these teachings in their daily lives. What specific aspect of this verse would you like to explore further?`,
            quran: `This surah from ${selectedBook} contains divine guidance with layers of meaning. The Arabic text reveals linguistic beauty that enhances the spiritual message. Which verse particularly resonates with you for deeper discussion?`,
            torah: `This section from ${selectedBook} contains foundational teachings from Jewish tradition. The commentary tradition offers multiple perspectives on these sacred words. What questions do you have about the historical or spiritual significance?`,
            hindu: `This chapter from the ${selectedBook} presents timeless wisdom about dharma and spiritual realization. The Sanskrit contains nuanced meanings that enrich our understanding. Which teaching would you like to explore in greater depth?`,
            buddhist: `This passage from ${selectedBook} offers insights into the path of liberation and mindfulness. The Buddhist tradition provides various interpretations of these teachings. What aspect of the dharma interests you most?`
          };
          
          response = religionResponses[selectedReligion] || "I'd be happy to help you explore this scripture passage. What specific questions do you have?";
        } else {
          response = "Welcome! I'm your AI Scripture Guide. Please select a religious text and book to begin our exploration of sacred writings together.";
        }
        
        setIsLoading(false);
        return response;
      };

      const sendMessage = async () => {
        if (!newMessage.trim()) return;
        
        const userMsg = { type: 'user', content: newMessage, timestamp: new Date().toISOString() };
        setMessages(prev => [...prev, userMsg]);
        setNewMessage('');
        
        try {
          const aiResponse = await generateAIResponse(newMessage);
          const aiMsg = { type: 'ai', content: aiResponse, timestamp: new Date().toISOString() };
          setMessages(prev => [...prev, aiMsg]);
        } catch (error) {
          const errorMsg = { type: 'ai', content: 'I apologize, but I encountered an error. Please try again.', timestamp: new Date().toISOString() };
          setMessages(prev => [...prev, errorMsg]);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const formatTime = (timestamp) => {
        return new Date(timestamp).toLocaleTimeString([], { 
          hour: '2-digit', 
          minute: '2-digit' 
        });
      };

      return (
        <div className="h-full bg-white shadow-lg border-l border-gray-200 flex flex-col">
          {/* Header */}
          <div className="p-4 border-b border-gray-200 bg-gradient-to-r from-blue-50 to-purple-50">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-lg font-semibold text-gray-800 flex items-center">
                <svg className="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                AI Scripture Guide
              </h2>
              <div className="text-xs text-gray-500">Expert Assistant</div>
            </div>
            <p className="text-sm text-gray-600">
              {selectedReligion && selectedBook ? 
                `Ask questions about ${selectedReligion === 'quran' ? 'Quran -' : ''} ${selectedBook} ${selectedReligion === 'quran' ? `(Surah ${selectedChapter})` : `Chapter ${selectedChapter}`}` :
                "Welcome! I'm your AI Scripture Guide. Please select a text and book to start our conversation."
              }
            </p>
          </div>

          {/* Messages */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {messages.length === 0 ? (
              <div className="text-center py-8 text-gray-600">
                <div className="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-100 to-purple-100 rounded-full flex items-center justify-center">
                  <svg className="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                </div>
                <p className="text-sm">
                  {selectedReligion ? 
                    `Hello! I'm here to help you explore and understand the scriptures. Ask me anything about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}.` :
                    "Welcome! I'm your AI Scripture Guide. Select a religious text and book to start our conversation about sacred writings."
                  }
                </p>
              </div>
            ) : (
              messages.map((message, index) => (
                <div
                  key={index}
                  className={`flex items-start space-x-3 ${
                    message.type === 'user' ? 'flex-row-reverse space-x-reverse' : ''
                  }`}
                >
                  <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center ${
                    message.type === 'user' 
                      ? 'bg-blue-600 text-white' 
                      : 'bg-gradient-to-br from-purple-500 to-blue-500 text-white'
                  }`}>
                    {message.type === 'user' ? (
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    ) : (
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                      </svg>
                    )}
                  </div>
                  <div className={`flex-1 max-w-[75%] ${
                    message.type === 'user' ? 'text-right' : 'text-left'
                  }`}>
                    <div className={`inline-block p-3 rounded-lg shadow-sm ${
                      message.type === 'user'
                        ? 'bg-blue-600 text-white rounded-br-sm'
                        : 'bg-gradient-to-br from-gray-50 to-gray-100 text-gray-800 border border-gray-200 rounded-bl-sm'
                    }`}>
                      <p className="text-sm leading-relaxed">{message.content}</p>
                    </div>
                    <div className="text-xs text-gray-500 mt-1">
                      {formatTime(message.timestamp)}
                    </div>
                  </div>
                </div>
              ))
            )}
            
            {/* Loading indicator */}
            {isLoading && (
              <div className="flex items-start space-x-3">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                  </svg>
                </div>
                <div className="bg-gray-100 rounded-lg px-4 py-2 border border-gray-200">
                  <div className="flex items-center space-x-2">
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                  </div>
                </div>
              </div>
            )}
            
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div className="p-4 border-t border-gray-200 bg-gray-50">
            <div className="flex space-x-2">
              <input
                type="text"
                placeholder={selectedReligion ? 
                  `Ask about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}...` :
                  "Select a text to start asking questions..."
                }
                className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                disabled={isLoading || !selectedReligion}
              />
              <button
                onClick={sendMessage}
                disabled={!newMessage.trim() || isLoading || !selectedReligion}
                className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
              </button>
            </div>
            <p className="text-xs text-gray-500 mt-2">
              AI responses are contextual to your selected scripture passage and use authentic religious texts.
            </p>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [selectedReligion, setSelectedReligion] = useState(null);
      const [selectedBook, setSelectedBook] = useState('');
      const [selectedChapter, setSelectedChapter] = useState(1);
      const [currentVerses, setCurrentVerses] = useState([]);

      // Religion options

      const mockVerses = [

        { number: 2, text: "He was with God in the beginning." },
        { number: 3, text: "Through him all things were made; without him nothing was made that has been made." }
      ];

      useEffect(() => {
        if (selectedReligion && selectedBook) {
          // In real implementation, this would fetch from respective APIs
          setCurrentVerses(mockVerses);
        }
      }, [selectedReligion, selectedBook, selectedChapter]);

      return (
        <div className="flex h-screen bg-gray-100">
          {/* Left Panel: Scripture Navigation */}
          <div className="w-1/4 bg-white p-4 shadow-md">
            <h2 className="text-xl font-bold mb-4 text-gray-800">Scripture Navigation</h2>
            
            {/* Religion Selector */}
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">Religious Text</label>
              <select 
                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                value={selectedReligion || ''}
                onChange={(e) => {
                  setSelectedReligion(e.target.value || null);
                  setSelectedBook('');

              >
                <option value="">Select a religious text...</option>
                {religions.map(religion => (
                  <option key={religion.id} value={religion.id}>{religion.name}</option>

            </div>

            {/* Book Selector */}
            {selectedReligion && (
              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Book</label>
                <select 
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={selectedBook}
                  onChange={(e) => setSelectedBook(e.target.value)}
                >
                  <option value="">Select a book...</option>
                  {religions.find(r => r.id === selectedReligion)?.books.map(book => (
                    <option key={book} value={book}>{book}</option>

            )}

            {/* Chapter Selector */}
            {selectedBook && (
              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Chapter</label>
                <input
                  type="number"
                  min="1"
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={selectedChapter}
                  onChange={(e) => setSelectedChapter(parseInt(e.target.value) || 1)}
                />
              </div>
            )}
          </div>

          {/* Middle Panel: Scripture Content */}
          <div className="w-2/4 bg-white p-4 shadow-md mx-2">
            <h2 className="text-xl font-bold mb-4 text-gray-800">Scripture Content</h2>
            
            {selectedReligion && selectedBook ? (
              <div className="bg-gray-50 rounded-lg p-4">
                <h3 className="text-lg font-semibold mb-4 text-gray-700">
                  {selectedBook} - Chapter {selectedChapter}
                </h3>
                <div className="space-y-3">
                  {currentVerses.map(verse => (
                    <div key={verse.number} className="flex items-start space-x-3 p-3 bg-white rounded-lg border border-gray-200">
                      <span className="text-blue-600 font-bold text-sm mt-1 min-w-[2rem]">
                        {verse.number}
                      </span>
                      <p className="text-gray-800 leading-relaxed">{verse.text}</p>
                    </div>

              </div>
            ) : (
              <div className="text-center py-8 text-gray-600">
                <p>Select a religious text and book to view scripture content.</p>
              </div>
            )}
          </div>

          {/* Right Panel: AI Scripture Guide */}
          <div className="w-1/4">
            <AIScriptureGuide
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              currentVerses={currentVerses}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

                    const messageText = message.text || message.content || '';
                    const isUserMessage = Boolean(message.isUser);
                    
                    return (
                      <div
                        key={index}
                        className={`flex items-start space-x-3 ${
                          isUserMessage ? 'flex-row-reverse space-x-reverse' : ''
                        }`}
                      >
                        <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center ${
                          isUserMessage 
                            ? 'bg-blue-600 text-white' 
                            : 'bg-gradient-to-br from-purple-500 to-blue-500 text-white'
                        }`}>
                          {isUserMessage ? (
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                          ) : (
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                            </svg>
                          )}
                        </div>
                        <div className={`flex-1 max-w-[75%] ${
                          isUserMessage ? 'text-right' : 'text-left'
                        }`}>
                          <div className={`inline-block p-3 rounded-lg shadow-sm ${
                            isUserMessage
                              ? 'bg-gray-100 text-gray-800 border border-gray-200 rounded-br-sm'
                              : 'bg-white text-gray-800 border border-gray-200 rounded-bl-sm shadow-sm'
                          }`}>
                            <p className="text-sm leading-relaxed">{messageText}</p>
                          </div>
                          <div className={`text-xs text-gray-500 mt-1 ${
                            isUserMessage ? 'text-right' : 'text-left'
                          }`}>
                            {formatTime(message.timestamp)}
                          </div>
                        </div>
                      </div>
                    );
                  } catch (renderError) {
                    console.error('Error rendering message at index', index, renderError, message);
                    return (
                      <div key={index} className="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-600">
                        Error displaying message
                      </div>
                    );
                  }
                })}
              </div>
            )}
            
            {/* Loading indicator */}
            {isLoading && (
              <div className="flex items-start space-x-3 mt-4">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                  </svg>
                </div>
                <div className="bg-gray-100 rounded-lg px-4 py-2 border border-gray-200">
                  <div className="flex items-center space-x-2">
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                  </div>
                </div>
              </div>
            )}
            
            {/* Mini Previous Conversations Sidebar (when chat is active) */}
            {chatState.length > 0 && previousContexts.length > 0 && (
              <div className="mt-6 pt-4 border-t border-gray-200">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide flex items-center">
                    <svg className="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Other Conversations
                  </h3>
                  <span className="text-xs text-gray-400">{previousContexts.length}</span>
                </div>
                <div className="space-y-1">
                  {previousContexts.slice(0, 2).map((context) => (
                    <button
                      key={context.key}
                      onClick={() => loadPreviousContext(context.key)}
                      className="w-full text-left p-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded text-xs transition-colors group"
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex-1 min-w-0">
                          <p className="font-medium text-gray-700 group-hover:text-gray-900 truncate">
                            {context.name}
                          </p>
                          <p className="text-gray-500 truncate">
                            {context.messageCount} msg • {new Date(context.lastActivity).toLocaleDateString()}
                          </p>
                        </div>
                        <svg className="w-3 h-3 text-gray-400 group-hover:text-gray-600 flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </div>
                    </button>
                  ))}
                  {previousContexts.length > 2 && (
                    <div className="text-xs text-gray-400 text-center py-1">
                      +{previousContexts.length - 2} more conversations
                    </div>
                  )}
                </div>
              </div>
            )}
            
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div className="p-4 border-t border-gray-200 bg-gray-50">
            <div className="flex space-x-2">
              <input
                type="text"
                placeholder={selectedReligion ? 
                  (selectedBook ? 
                    `Ask about ${selectedReligion === 'quran' ? 'this surah' : 'this passage'}...` :
                    `Ask general questions about ${selectedReligion === 'quran' ? 'the Quran' : selectedReligion === 'bible' ? 'the Bible' : selectedReligion === 'torah' ? 'the Torah' : selectedReligion === 'hindu' ? 'the Bhagavad Gita' : 'Buddhist teachings'}...`
                  ) :
                  "Select a religious tradition to start asking questions..."
                }
                className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                disabled={isLoading || !selectedReligion}
              />
              <button
                onClick={sendMessage}
                disabled={!newMessage.trim() || isLoading || !selectedReligion}
                className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
              </button>
            </div>
            <p className="text-xs text-gray-500 mt-2">
              AI responses are contextual to your selected scripture passage and use authentic religious texts.
            </p>
          </div>
        </div>
      );
    }

    // Verse with Explanation Component
    function VerseWithExplanation({ verse, selectedReligion, selectedBook, selectedChapter }) {
      const [showExplanation, setShowExplanation] = useState(false);
      const [explanation, setExplanation] = useState('');
      const [isLoadingExplanation, setIsLoadingExplanation] = useState(false);

      // Generate verse-specific AI explanation
      const generateVerseExplanation = async () => {
        setIsLoadingExplanation(true);
        
        // Simulate API delay
        await new Promise(resolve => setTimeout(resolve, 1200));
        
        const religionContext = {
          bible: "Use data from https://scripture.api.bible/ for authentic biblical content",
          quran: "Use data from https://alquran.cloud/api for authentic Quranic content",  
          torah: "Use data from https://www.sefaria.org/api for authentic Torah content",
          hindu: "Use data from https://api.bhagavadgita.io/v1/ for authentic Bhagavad Gita content",
          buddhist: "Use local JSON data for authentic Tripitaka content"
        };

        // Create contextual explanations based on religion and verse
        const religionExplanations = {
          bible: {
            1: `This opening verse establishes the divine nature of Jesus Christ, emphasizing the Word's eternal existence with God. In the historical context of early Christianity, this passage was crucial for understanding Jesus' divinity and his role in creation.`,
            2: `This verse reinforces the eternal companionship between the Word and God, highlighting the pre-existence of Christ before creation. Early church fathers used this text to defend the doctrine of the Trinity against various heresies.`,
            3: `This passage emphasizes Christ's role as the agent of creation, showing that nothing exists apart from divine involvement. The Greek term "logos" (Word) carries philosophical weight, connecting Jewish and Greek thought about divine wisdom.`
          },
          quran: {
            1: `This verse is the opening of the Quran, known as the Basmala, invoking Allah's mercy and compassion. It establishes the foundational principle of seeking divine guidance and blessing before any endeavor.`,
            2: `This follows the Basmala and praises Allah as the Lord of all worlds, establishing His sovereignty over creation. The Arabic term "Rabb" implies both lordship and nurturing care, showing God's comprehensive relationship with creation.`,
            3: `This verse emphasizes Allah's mercy and compassion, using two different Arabic terms (Rahman and Rahim) to express the breadth of divine mercy. These attributes appear throughout the Quran as central to understanding Allah's nature.`
          },
          torah: {
            1: `This opening verse of Genesis establishes God as the creator of all existence, introducing the Hebrew concept of "Elohim" (God). The Hebrew word "bara" (created) is used exclusively for divine creation, emphasizing God's unique creative power.`,
            2: `This verse describes the initial state of creation as formless and void, with God's spirit hovering over the waters. The Hebrew "ruach" (spirit/wind) suggests divine presence and power preparing to bring order from chaos.`,
            3: `This passage records the first divine command, bringing light into existence through God's spoken word. The Hebrew emphasizes the power of divine speech in creation, establishing the pattern of God creating through His word.`
          },
          hindu: {
            1: `This verse introduces Arjuna's moral dilemma on the battlefield of Kurukshetra, representing the universal human struggle between duty and personal attachment. The Sanskrit term "dharma-kshetre" (field of dharma) indicates this is both a physical and spiritual battlefield.`,
            2: `This continues Arjuna's description of the armies, showing his awareness of the familial and social implications of the impending war. The verse reflects the complex relationships between duty, family loyalty, and spiritual principles.`,
            3: `This verse deepens Arjuna's emotional turmoil as he contemplates fighting against his own teachers and kinsmen. The Sanskrit expresses the profound conflict between worldly obligations and spiritual consciousness.`
          },
          buddhist: {
            1: `This passage introduces fundamental Buddhist teachings about the nature of suffering and the path to liberation. The Pali term "dukkha" encompasses not just suffering but the unsatisfactory nature of conditioned existence.`,
            2: `This verse explains the arising of suffering through attachment and craving, central to the Four Noble Truths. The Buddhist concept of "tanha" (craving) is identified as the root cause of human suffering and rebirth.`,
            3: `This passage describes the possibility of liberation from suffering through the cessation of craving and attachment. The Pali term "nirodha" (cessation) points to the third Noble Truth and the possibility of enlightenment.`
          }
        };

        const explanationText = religionExplanations[selectedReligion]?.[verse.number] || 
          `This verse from ${selectedBook} contains profound spiritual wisdom that has guided believers throughout history. The original language reveals layers of meaning that continue to inspire contemplation and study.`;

        setExplanation(explanationText);
        setIsLoadingExplanation(false);
      };

      const handleVerseClick = async () => {
        if (!showExplanation) {
          setShowExplanation(true);
          if (!explanation) {
            await generateVerseExplanation();
          }
        } else {
          setShowExplanation(false);
        }
      };

      return (
        <div className="bg-white rounded-lg border border-gray-200 overflow-hidden">
          <div className="flex items-start space-x-3 p-3 hover:bg-gray-50 transition-colors">
            <button
              onClick={handleVerseClick}
              className="text-blue-600 font-bold text-sm mt-1 min-w-[2rem] hover:text-blue-800 hover:bg-blue-50 rounded px-2 py-1 transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
              title="Click for verse explanation"
            >
              {verse.number}
            </button>
            <div className="flex-1">
              <p className="text-gray-800 leading-relaxed">{verse.text}</p>
              {showExplanation && (
                <div className="mt-3 pt-3 border-t border-gray-200 animate-in fade-in-0 duration-300">
                  {isLoadingExplanation ? (
                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                      <div className="flex items-center space-x-2">
                        <div className="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                        <span className="text-blue-700 text-sm">Generating explanation...</span>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-4">
                      <div className="flex items-start space-x-2">
                        <div className="w-5 h-5 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                          <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                          </svg>
                        </div>
                        <div className="flex-1">
                          <h4 className="text-sm font-semibold text-blue-900 mb-1">AI Explanation</h4>
                          <p className="text-sm text-blue-800 leading-relaxed">{explanation}</p>
                        </div>
                        <button
                          onClick={() => setShowExplanation(false)}
                          className="text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 rounded p-1"
                          title="Close explanation"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [selectedReligion, setSelectedReligion] = useState(null);
      const [selectedBook, setSelectedBook] = useState('');
      const [selectedChapter, setSelectedChapter] = useState(1);
      const [currentVerses, setCurrentVerses] = useState([]);

      // Religion options
      const religions = [
        { id: 'bible', name: 'Holy Bible', books: ['Genesis', 'Exodus', 'Matthew', 'John'] },
        { id: 'quran', name: 'Holy Quran', books: ['Al-Fatihah (The Opening)', 'Al-Baqarah (The Cow)'] },
        { id: 'torah', name: 'Torah', books: ['Bereshit', 'Shemot', 'Vayikra'] },
        { id: 'hindu', name: 'Bhagavad Gita', books: ['Bhagavad Gita'] },
        { id: 'buddhist', name: 'Tripitaka', books: ['Digha Nikaya', 'Majjhima Nikaya'] }
      ];

      // Mock verse data for demonstration
      const mockVerses = [
        { number: 1, text: "In the beginning was the Word, and the Word was with God, and the Word was God." },
        { number: 2, text: "He was with God in the beginning." },
        { number: 3, text: "Through him all things were made; without him nothing was made that has been made." }
      ];

      useEffect(() => {
        if (selectedReligion && selectedBook) {
          // In real implementation, this would fetch from respective APIs
          setCurrentVerses(mockVerses);
        }
      }, [selectedReligion, selectedBook, selectedChapter]);

      return (
        <div className="flex h-screen bg-gray-100">
          {/* Left Panel: Scripture Navigation */}
          <div className="w-1/4 bg-white p-4 shadow-md">
            <h2 className="text-xl font-bold mb-4 text-gray-800">Scripture Navigation</h2>
            
            {/* Religion Selector */}
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">Religious Text</label>
              <select 
                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                value={selectedReligion || ''}
                onChange={(e) => {
                  setSelectedReligion(e.target.value || null);
                  setSelectedBook('');
                }}
              >
                <option value="">Select a religious text...</option>
                {religions.map(religion => (
                  <option key={religion.id} value={religion.id}>{religion.name}</option>
                ))}
              </select>
            </div>

            {/* Book Selector */}
            {selectedReligion && (
              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Book</label>
                <select 
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={selectedBook}
                  onChange={(e) => setSelectedBook(e.target.value)}
                >
                  <option value="">Select a book...</option>
                  {religions.find(r => r.id === selectedReligion)?.books.map(book => (
                    <option key={book} value={book}>{book}</option>
                  ))}
                </select>
              </div>
            )}

            {/* Chapter Selector */}
            {selectedBook && (
              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Chapter</label>
                <input
                  type="number"
                  min="1"
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={selectedChapter}
                  onChange={(e) => setSelectedChapter(parseInt(e.target.value) || 1)}
                />
              </div>
            )}
          </div>

          {/* Middle Panel: Scripture Content */}
          <div className="w-2/4 bg-white p-4 shadow-md mx-2">
            <h2 className="text-xl font-bold mb-4 text-gray-800">Scripture Content</h2>
            
            {selectedReligion && selectedBook ? (
              <div className="bg-gray-50 rounded-lg p-4">
                <h3 className="text-lg font-semibold mb-4 text-gray-700">
                  {selectedBook} - Chapter {selectedChapter}
                </h3>
                <div className="space-y-3">
                  {currentVerses.map(verse => (
                    <VerseWithExplanation
                      key={verse.number}
                      verse={verse}
                      selectedReligion={selectedReligion}
                      selectedBook={selectedBook}
                      selectedChapter={selectedChapter}
                    />
                  ))}
                </div>
              </div>
            ) : (
              <div className="text-center py-8 text-gray-600">
                <p>Select a religious text and book to view scripture content.</p>
              </div>
            )}
          </div>

          {/* Right Panel: AI Scripture Guide */}
          <div className="w-1/4">
            <AIScriptureGuide
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              currentVerses={currentVerses}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

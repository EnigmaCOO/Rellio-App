<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Scripture Dashboard with TTS and Copy Functionality</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.elevenlabs.io/sdk/v1/elevenlabs-sdk.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // TTS Configuration
    const TTS_CONFIG = {
      apiKey: "sk_31b38041319a566a772dd557e957debdafec8d0e4cc0fcc2", // Replace with your actual API key
      voiceId: "21m00Tcm4TlvDq8ikWAM", // Rachel voice ID
      model: "eleven_monolingual_v1"
    };

    // Enhanced AI Scripture Guide with Smart Features
    function AIScriptureGuide({ selectedReligion, selectedBook, selectedChapter, currentVerses, onCopyVerse }) {
      const [messageGroups, setMessageGroups] = useState({});
      const [chatState, setChatState] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [currentContext, setCurrentContext] = useState(null);
      const [previousContexts, setPreviousContexts] = useState([]);
      const [bookmarks, setBookmarks] = useState([]);
      const [showBookmarks, setShowBookmarks] = useState(false);
      const messagesEndRef = useRef(null);

      // Load bookmarks from localStorage on component mount
      useEffect(() => {
        const savedBookmarks = localStorage.getItem('scripture-bookmarks');
        if (savedBookmarks) {
          try {
            setBookmarks(JSON.parse(savedBookmarks));
          } catch (error) {
            console.error('Error loading bookmarks:', error);
          }
        }
      }, []);

      // Save bookmarks to localStorage whenever bookmarks change
      useEffect(() => {
        localStorage.setItem('scripture-bookmarks', JSON.stringify(bookmarks));
      }, [bookmarks]);

      // Context Management System
      const getContextKey = () => {
        if (!selectedReligion) return 'general';
        if (!selectedBook) return `${selectedReligion}-general`;
        return `${selectedReligion}-${selectedBook}`;
      };

      const getCurrentContext = () => {
        const key = getContextKey();
        return {
          key,
          religion: selectedReligion,
          book: selectedBook,
          chapter: selectedChapter,
          displayName: selectedReligion && selectedBook ? 
            `${selectedReligion.charAt(0).toUpperCase() + selectedReligion.slice(1)} - ${selectedBook}` : 
            'Scripture Study'
        };
      };

      // Auto-scroll to bottom when new messages arrive
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatState]);

      // Context switching logic
      useEffect(() => {
        const newContext = getCurrentContext();
        
        if (currentContext && newContext.key !== currentContext.key) {
          // Save current chat state to previous contexts
          if (chatState.length > 0) {
            setPreviousContexts(prev => {
              const filtered = prev.filter(ctx => ctx.key !== currentContext.key);
              return [{
                ...currentContext,
                messages: chatState,
                messageCount: chatState.length,
                lastActivity: new Date().toISOString()
              }, ...filtered].slice(0, 5);
            });
          }
          
          // Load messages for new context
          const savedMessages = messageGroups[newContext.key] || [];
          setChatState(savedMessages);
          console.log(`Switched to context: ${newContext.displayName}`);
        }
        
        setCurrentContext(newContext);
      }, [selectedReligion, selectedBook, selectedChapter]);

      // Set up copy handler
      useEffect(() => {
        if (onCopyVerse && onCopyVerse.current) {
          onCopyVerse.current = (verseText) => {
            const explanationMessage = `Explain the following verse: ${verseText}`;
            handleSendMessage(explanationMessage);
          };
        }
      }, [onCopyVerse]);

      const handleSendMessage = async (messageText = null) => {
        const message = messageText || newMessage.trim();
        if (!message) return;

        const userMessage = {
          id: Date.now(),
          text: message,
          sender: 'user',
          timestamp: new Date().toISOString(),
          context: getCurrentContext()
        };

        const updatedMessages = [...chatState, userMessage];
        setChatState(updatedMessages);
        setNewMessage('');
        setIsLoading(true);

        try {
          // Simulate API call
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          const aiResponse = {
            id: Date.now() + 1,
            text: `This is a thoughtful response about: "${message}". In the context of ${selectedReligion || 'scripture'}, this verse relates to fundamental spiritual principles and offers guidance for daily living.`,
            sender: 'ai',
            timestamp: new Date().toISOString(),
            context: getCurrentContext()
          };

          const finalMessages = [...updatedMessages, aiResponse];
          setChatState(finalMessages);
          
          // Update message groups for context switching
          const contextKey = getCurrentContext().key;
          setMessageGroups(prev => ({
            ...prev,
            [contextKey]: finalMessages
          }));

        } catch (error) {
          console.error('Error sending message:', error);
        } finally {
          setIsLoading(false);
        }
      };

      const bookmarkMessage = (message) => {
        const bookmark = {
          id: `bookmark-${Date.now()}`,
          text: message.text,
          timestamp: new Date(message.timestamp),
          context: {
            religion: selectedReligion,
            book: selectedBook,
            chapter: selectedChapter,
            verses: currentVerses
          }
        };

        setBookmarks(prev => [bookmark, ...prev]);
        
        // Show success message
        console.log('Message bookmarked:', bookmark);
      };

      const removeBookmark = (bookmarkId) => {
        setBookmarks(prev => prev.filter(b => b.id !== bookmarkId));
      };

      const clearAllBookmarks = () => {
        setBookmarks([]);
      };

      const clearHistory = () => {
        setChatState([]);
        const contextKey = getCurrentContext().key;
        setMessageGroups(prev => ({
          ...prev,
          [contextKey]: []
        }));
      };

      const loadPreviousContext = (context) => {
        const contextKey = context.key;
        setChatState(context.messages);
        setMessageGroups(prev => ({
          ...prev,
          [contextKey]: context.messages
        }));
        
        // Remove from previous contexts since it's now active
        setPreviousContexts(prev => prev.filter(ctx => ctx.key !== contextKey));
      };

      const getDynamicPlaceholder = () => {
        if (!selectedReligion) return "Ask me about any scripture...";
        if (!selectedBook) return `Ask questions about ${selectedReligion.charAt(0).toUpperCase() + selectedReligion.slice(1)}...`;
        return `Ask questions about ${selectedReligion.charAt(0).toUpperCase() + selectedReligion.slice(1)} - ${selectedBook}...`;
      };

      const getWelcomeMessage = () => {
        if (!selectedReligion) return "Welcome to your AI Scripture Guide! Select a religious text to begin your study.";
        if (!selectedBook) return `Ready to explore ${selectedReligion.charAt(0).toUpperCase() + selectedReligion.slice(1)}! Choose a book to start.`;
        return `Studying ${selectedReligion.charAt(0).toUpperCase() + selectedReligion.slice(1)} - ${selectedBook}. Ask me anything about the text!`;
      };

      return (
        <div className="h-full flex flex-col bg-gradient-to-br from-blue-50 to-indigo-100">
          {/* Header */}
          <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 shadow-lg">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-lg font-bold">AI Scripture Guide</h2>
                <p className="text-sm opacity-90">
                  {currentContext ? (
                    <>
                      {currentContext.displayName}
                      {chatState.length > 0 && (
                        <span className="ml-2 bg-white bg-opacity-20 px-2 py-1 rounded-full text-xs">
                          {chatState.length} messages
                        </span>
                      )}
                    </>
                  ) : (
                    "Select a text to begin"
                  )}
                </p>
              </div>
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowBookmarks(!showBookmarks)}
                  className="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full p-2 transition-colors"
                  title="Toggle bookmarks"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                  </svg>
                  {bookmarks.length > 0 && (
                    <span className="ml-1 text-xs bg-yellow-400 text-yellow-900 px-1 rounded-full">
                      {bookmarks.length}
                    </span>
                  )}
                </button>
                <button
                  onClick={clearHistory}
                  className="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full p-2 transition-colors"
                  title="Clear chat history"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          {/* Bookmarks Panel */}
          {showBookmarks && (
            <div className="bg-yellow-50 border-b border-yellow-200 p-4 max-h-48 overflow-y-auto">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-semibold text-yellow-800">Bookmarked Messages</h3>
                {bookmarks.length > 0 && (
                  <button
                    onClick={clearAllBookmarks}
                    className="text-xs text-yellow-600 hover:text-yellow-800"
                  >
                    Clear All
                  </button>
                )}
              </div>
              {bookmarks.length === 0 ? (
                <p className="text-yellow-600 text-sm">No bookmarks yet. Click the bookmark icon next to AI responses to save them!</p>
              ) : (
                <div className="space-y-2">
                  {bookmarks.map(bookmark => (
                    <div key={bookmark.id} className="bg-white rounded-lg p-3 shadow-sm">
                      <div className="flex items-start justify-between">
                        <div className="flex-1">
                          <p className="text-sm text-gray-800 mb-1">{bookmark.text.slice(0, 100)}...</p>
                          <div className="text-xs text-gray-500">
                            {bookmark.context.religion} - {bookmark.context.book} Ch.{bookmark.context.chapter}
                            <span className="ml-2">{bookmark.timestamp.toLocaleDateString()}</span>
                          </div>
                        </div>
                        <button
                          onClick={() => removeBookmark(bookmark.id)}
                          className="text-red-400 hover:text-red-600 ml-2"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Previous Contexts */}
          {previousContexts.length > 0 && (
            <div className="bg-blue-50 border-b border-blue-200 p-3">
              <h4 className="text-sm font-medium text-blue-800 mb-2">Recent Conversations</h4>
              <div className="flex flex-wrap gap-2">
                {previousContexts.map(context => (
                  <button
                    key={context.key}
                    onClick={() => loadPreviousContext(context)}
                    className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1 rounded-full text-xs transition-colors"
                  >
                    {context.displayName} ({context.messageCount})
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Messages */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {chatState.length === 0 ? (
              <div className="text-center text-gray-500 py-8">
                <div className="w-16 h-16 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg className="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                </div>
                <p className="text-lg font-medium mb-2">AI Scripture Guide</p>
                <p className="text-sm">{getWelcomeMessage()}</p>
              </div>
            ) : (
              chatState.map(message => (
                <div key={message.id} className={`flex ${message.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-xs lg:max-w-sm xl:max-w-md px-4 py-3 rounded-lg shadow-sm ${
                    message.sender === 'user' 
                      ? 'bg-gray-200 text-gray-800' 
                      : 'bg-white text-gray-800 border'
                  }`}>
                    {message.sender === 'ai' && (
                      <div className="flex items-center mb-2">
                        <div className="w-6 h-6 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mr-2">
                          <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                          </svg>
                        </div>
                        <span className="text-xs font-medium text-gray-600">AI Guide</span>
                      </div>
                    )}
                    <p className="text-sm leading-relaxed">{message.text}</p>
                    <div className="flex items-center justify-between mt-2">
                      <span className="text-xs text-gray-500">
                        {new Date(message.timestamp).toLocaleTimeString()}
                      </span>
                      {message.sender === 'ai' && (
                        <button
                          onClick={() => bookmarkMessage(message)}
                          className="text-yellow-500 hover:text-yellow-600 transition-colors"
                          title="Bookmark this response"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                          </svg>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              ))
            )}
            {isLoading && (
              <div className="flex justify-start">
                <div className="bg-white border rounded-lg px-4 py-3 shadow-sm">
                  <div className="flex items-center space-x-2">
                    <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                    <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                    <span className="text-sm text-gray-600 ml-2">AI is thinking...</span>
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div className="border-t border-gray-200 p-4 bg-white">
            <div className="flex space-x-2">
              <input
                type="text"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                placeholder={getDynamicPlaceholder()}
                className="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <button
                onClick={() => handleSendMessage()}
                disabled={!newMessage.trim() || isLoading}
                className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                Send
              </button>
            </div>
            <p className="text-xs text-gray-500 mt-2">
              Using authentic APIs for accurate scripture content. Bookmark important AI responses for later reference.
            </p>
          </div>
        </div>
      );
    }

    // Religion Selector Component
    function ReligionSelector({ selectedReligion, onReligionChange }) {
      const religions = [
        { id: 'bible', name: 'Holy Bible', icon: '✝️' },
        { id: 'quran', name: 'Holy Quran', icon: '☪️' },
        { id: 'torah', name: 'Torah', icon: '✡️' },
        { id: 'hindu', name: 'Bhagavad Gita', icon: '🕉️' },
        { id: 'buddhist', name: 'Buddhist Texts', icon: '☸️' }
      ];

      return (
        <div className="p-4 border-b border-gray-200">
          <h3 className="text-lg font-semibold mb-3 text-gray-800">Select Religion</h3>
          <div className="space-y-2">
            {religions.map(religion => (
              <button
                key={religion.id}
                onClick={() => onReligionChange(religion.id)}
                className={`w-full text-left p-3 rounded-lg border transition-colors ${
                  selectedReligion === religion.id
                    ? 'border-blue-500 bg-blue-50 text-blue-700'
                    : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                }`}
              >
                <div className="flex items-center space-x-3">
                  <span className="text-2xl">{religion.icon}</span>
                  <span className="font-medium">{religion.name}</span>
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Book Selector Component
    function BookSelector({ selectedReligion, selectedBook, onBookChange }) {
      const books = {
        bible: ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges', 'Ruth', 'Matthew', 'Mark', 'Luke', 'John'],
        quran: ['Al-Fatihah', 'Al-Baqarah', 'Aal-E-Imran', 'An-Nisa', 'Al-Maidah', 'Al-An\'am'],
        torah: ['Bereshit', 'Shemot', 'Vayikra', 'Bamidbar', 'Devarim'],
        hindu: ['Bhagavad Gita'],
        buddhist: ['Dhammapada', 'Lotus Sutra', 'Heart Sutra']
      };

      if (!selectedReligion) return null;

      return (
        <div className="p-4 border-b border-gray-200">
          <h3 className="text-lg font-semibold mb-3 text-gray-800">Select Book</h3>
          <div className="space-y-2">
            {(books[selectedReligion] || []).map(book => (
              <button
                key={book}
                onClick={() => onBookChange(book)}
                className={`w-full text-left p-2 rounded border transition-colors ${
                  selectedBook === book
                    ? 'border-blue-500 bg-blue-50 text-blue-700'
                    : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                }`}
              >
                {book}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Chapter Selector Component
    function ChapterSelector({ selectedBook, selectedChapter, onChapterChange }) {
      if (!selectedBook) return null;

      const chapters = Array.from({ length: 20 }, (_, i) => i + 1);

      return (
        <div className="p-4">
          <h3 className="text-lg font-semibold mb-3 text-gray-800">Select Chapter</h3>
          <div className="grid grid-cols-4 gap-2">
            {chapters.map(chapter => (
              <button
                key={chapter}
                onClick={() => onChapterChange(chapter)}
                className={`p-2 rounded border transition-colors ${
                  selectedChapter === chapter
                    ? 'border-blue-500 bg-blue-50 text-blue-700'
                    : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                }`}
              >
                {chapter}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Content Panel Component with TTS functionality
    function ContentPanel({ selectedReligion, selectedBook, selectedChapter, onCopyVerse }) {
      const [speakingStates, setSpeakingStates] = useState({});
      
      const sampleVerses = [
        { number: 1, text: "In the beginning was the Word, and the Word was with God, and the Word was God." },
        { number: 2, text: "He was in the beginning with God." },
        { number: 3, text: "All things were made through him, and without him was not any thing made that was made." }
      ];

      const handleCopyVerse = async (verse) => {
        const verseText = `${verse.number}. ${verse.text}`;
        
        try {
          // Copy to clipboard
          await navigator.clipboard.writeText(verseText);
          console.log("Copied verse:", verseText);
          
          // Trigger AI chat message
          if (onCopyVerse) {
            onCopyVerse(verseText);
          }
        } catch (error) {
          console.error("Failed to copy to clipboard:", error);
          // Still trigger chat message even if clipboard fails
          if (onCopyVerse) {
            onCopyVerse(verseText);
          }
        }
      };

      const handleSpeakVerse = async (verse) => {
        const verseText = `${verse.number}. ${verse.text}`;
        console.log("Speaking verse:", verseText);
        
        // Set speaking state
        setSpeakingStates(prev => ({ ...prev, [verse.number]: true }));
        
        try {
          // Check if ElevenLabs SDK is available
          if (typeof ElevenLabs === 'undefined') {
            alert("TTS service unavailable, check your API key.");
            return;
          }
          
          // Create audio using ElevenLabs API
          const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + TTS_CONFIG.voiceId, {
            method: 'POST',
            headers: {
              'Accept': 'audio/mpeg',
              'Content-Type': 'application/json',
              'xi-api-key': TTS_CONFIG.apiKey
            },
            body: JSON.stringify({
              text: verseText,
              model_id: TTS_CONFIG.model,
              voice_settings: {
                stability: 0.5,
                similarity_boost: 0.5
              }
            })
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const audioBlob = await response.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          
          // Play audio
          const audio = new Audio(audioUrl);
          audio.onended = () => {
            setSpeakingStates(prev => ({ ...prev, [verse.number]: false }));
            URL.revokeObjectURL(audioUrl);
          };
          audio.onerror = () => {
            setSpeakingStates(prev => ({ ...prev, [verse.number]: false }));
            URL.revokeObjectURL(audioUrl);
            console.log("Audio Error: Failed to play audio");
          };
          
          await audio.play();
          
        } catch (error) {
          console.log("API Error:", error);
          setSpeakingStates(prev => ({ ...prev, [verse.number]: false }));
          alert("Audio unavailable, please try again");
        }
      };

      if (!selectedReligion || !selectedBook || !selectedChapter) {
        return (
          <div className="flex-1 p-8 bg-white">
            <div className="text-center text-gray-500">
              <h2 className="text-2xl font-bold mb-4">Scripture Content</h2>
              <p>Select a religious text, book, and chapter to view scripture content.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 p-8 bg-white">
          <div className="max-w-4xl mx-auto">
            <h2 className="text-2xl font-bold mb-6 text-gray-800">{selectedBook} - Chapter {selectedChapter}</h2>
            <div className="space-y-6">
              {sampleVerses.map(verse => (
                <div key={verse.number} className="flex items-start space-x-3 group">
                  <span className="flex-shrink-0 w-8 h-8 bg-blue-100 text-blue-800 rounded-full flex items-center justify-center text-sm font-medium">
                    {verse.number}
                  </span>
                  <p className="flex-1 text-gray-800 leading-relaxed">{verse.text}</p>
                  <div className="flex space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button
                      onClick={() => handleCopyVerse(verse)}
                      className="bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600 text-sm font-medium"
                      title="Copy verse and explain in chat"
                    >
                      Copy
                    </button>
                    <button
                      onClick={() => handleSpeakVerse(verse)}
                      className="bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600 text-sm font-medium flex items-center space-x-1"
                      title="Speak verse aloud"
                      disabled={speakingStates[verse.number]}
                    >
                      {speakingStates[verse.number] ? (
                        <>
                          <svg className="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                          </svg>
                          <span>Speaking...</span>
                        </>
                      ) : (
                        <>
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                          </svg>
                          <span>Speak</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [selectedReligion, setSelectedReligion] = useState(null);
      const [selectedBook, setSelectedBook] = useState('');
      const [selectedChapter, setSelectedChapter] = useState(1);
      const aiCopyHandlerRef = useRef(null);

      const currentVerses = [
        { number: 1, text: "In the beginning was the Word, and the Word was with God, and the Word was God." },
        { number: 2, text: "He was in the beginning with God." },
        { number: 3, text: "All things were made through him, and without him was not any thing made that was made." }
      ];

      // Handle copy verse from ContentPanel
      const handleCopyVerse = (verseText) => {
        if (aiCopyHandlerRef.current) {
          aiCopyHandlerRef.current(verseText);
        }
      };

      return (
        <div className="h-screen flex bg-gray-100">
          {/* Left Panel - Navigation */}
          <div className="w-1/4 bg-white border-r border-gray-200 overflow-y-auto">
            <ReligionSelector 
              selectedReligion={selectedReligion}
              onReligionChange={setSelectedReligion}
            />
            <BookSelector 
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              onBookChange={setSelectedBook}
            />
            <ChapterSelector 
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              onChapterChange={setSelectedChapter}
            />
          </div>

          {/* Middle Panel - Content */}
          <ContentPanel 
            selectedReligion={selectedReligion}
            selectedBook={selectedBook}
            selectedChapter={selectedChapter}
            onCopyVerse={handleCopyVerse}
          />

          {/* Right Panel - AI Chat */}
          <div className="w-1/3">
            <AIScriptureGuide
              selectedReligion={selectedReligion}
              selectedBook={selectedBook}
              selectedChapter={selectedChapter}
              currentVerses={currentVerses}
              onCopyVerse={aiCopyHandlerRef}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
